[project]
name = "IENIM-schedule-builder"
version = "0.1.0"
description = "Schedule builder for IENIM"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "ortools>=9.10",
    "pandas>=3.1.1",
    "streamlit>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "parser*"]
exclude = ["outputs*", "output*", "runs*", "docs*", "tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
